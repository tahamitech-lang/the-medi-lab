<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - The Medicare Laboratory</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2d970d;
            --primary-dark: #1f6e09;
            --primary-light: #4ff054;
            --bg-dark: #080f07;
            --bg-card: rgba(255, 255, 255, 0.04);
            --text-white: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.6);
            --border-glass: rgba(255, 255, 255, 0.06);
            --radius: 20px;
            --transition: 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: var(--text-white);
            min-height: 100vh;
            background-image: radial-gradient(ellipse at 20% 50%, rgba(45, 151, 13, 0.06) 0%, transparent 60%);
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background-image: linear-gradient(rgba(79, 240, 84, 0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(79, 240, 84, 0.015) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        .admin-container {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 1.5rem 2rem;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 0 1.5rem;
            border-bottom: 1px solid var(--border-glass);
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .header-logo {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            text-decoration: none;
        }

        .header-logo img {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 2px solid rgba(79, 240, 84, 0.3);
        }

        .header-logo span {
            font-weight: 800;
            font-size: 1.1rem;
            background: linear-gradient(135deg, #ffffff, rgba(255, 255, 255, 0.7));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .admin-badge {
            background: rgba(79, 240, 84, 0.1);
            color: var(--primary-light);
            padding: 0.3rem 1rem;
            border-radius: 60px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border: 1px solid rgba(79, 240, 84, 0.1);
        }

        .logout-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-glass);
            color: var(--text-muted);
            padding: 0.6rem 1.4rem;
            border-radius: 60px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            background: rgba(255, 107, 107, 0.1);
            border-color: #ff6b6b;
            color: #ff6b6b;
        }

        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.2rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius);
            padding: 1.5rem;
            transition: all var(--transition);
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        .stat-card .number {
            font-size: 2.2rem;
            font-weight: 900;
        }

        .stat-card .label {
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 500;
        }

        /* Tabs */
        .admin-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            background: rgba(255, 255, 255, 0.02);
            padding: 0.5rem;
            border-radius: 60px;
            border: 1px solid var(--border-glass);
        }

        .admin-tab {
            padding: 0.7rem 1.5rem;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.85rem;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .admin-tab.active {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            box-shadow: 0 4px 20px rgba(45, 151, 13, 0.3);
        }

        .admin-tab:hover:not(.active) {
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
        }

        /* Tables */
        .table-container {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius);
            padding: 1.5rem;
            overflow-x: auto;
        }

        .table-container h3 {
            margin-bottom: 1rem;
            font-size: 1.1rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        thead {
            background: rgba(255, 255, 255, 0.03);
        }

        th {
            text-align: left;
            padding: 0.8rem 1rem;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid var(--border-glass);
        }

        td {
            padding: 0.8rem 1rem;
            border-bottom: 1px solid var(--border-glass);
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }

        .status-badge {
            padding: 0.2rem 0.8rem;
            border-radius: 60px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .status-badge.active {
            background: rgba(79, 240, 84, 0.1);
            color: var(--primary-light);
        }

        .status-badge.pending {
            background: rgba(240, 180, 79, 0.1);
            color: #f0b44f;
        }

        .status-badge.inactive {
            background: rgba(255, 107, 107, 0.1);
            color: #ff6b6b;
        }

        .btn-action {
            padding: 0.3rem 0.8rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.75rem;
            transition: all 0.3s ease;
        }

        .btn-action.edit {
            background: rgba(79, 150, 240, 0.1);
            color: #4f9af0;
        }

        .btn-action.edit:hover {
            background: rgba(79, 150, 240, 0.2);
        }

        .btn-action.delete {
            background: rgba(255, 107, 107, 0.1);
            color: #ff6b6b;
        }

        .btn-action.delete:hover {
            background: rgba(255, 107, 107, 0.2);
        }

        .btn-action.view {
            background: rgba(79, 240, 84, 0.1);
            color: var(--primary-light);
        }

        .btn-action.view:hover {
            background: rgba(79, 240, 84, 0.2);
        }

        /* Tabs Content */
        .tab-content {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Add Report Form */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .form-group label {
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--text-light);
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 0.7rem 1rem;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            color: #fff;
            font-family: inherit;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary-light);
            box-shadow: 0 0 0 4px rgba(79, 240, 84, 0.06);
        }

        .form-group select option {
            background: #1a1a1a;
            color: #fff;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 60px;
        }

        .btn-submit-form {
            padding: 0.8rem 2rem;
            border: none;
            border-radius: 60px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(45, 151, 13, 0.3);
        }

        .btn-submit-form:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(45, 151, 13, 0.4);
        }

        .form-banner {
            display: none;
            padding: 0.8rem 1rem;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .form-banner.show {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .form-banner.success {
            background: rgba(79, 240, 84, 0.08);
            border: 1px solid rgba(79, 240, 84, 0.15);
            color: var(--primary-light);
        }

        .form-banner.error {
            background: rgba(255, 107, 107, 0.08);
            border: 1px solid rgba(255, 107, 107, 0.15);
            color: #ff6b6b;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 0;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 3rem;
            opacity: 0.3;
            margin-bottom: 1rem;
            display: block;
        }

        @media (max-width: 768px) {
            .admin-container {
                padding: 1rem;
            }
            .form-grid {
                grid-template-columns: 1fr;
            }
            .admin-tabs {
                border-radius: 16px;
                flex-direction: column;
            }
            .admin-tab {
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <div class="admin-container">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <a href="index.html" class="header-logo">
                    <img src="images/Lab Logo.png" alt="The Medicare Laboratory">
                    <span>The Medicare Laboratory</span>
                </a>
                <span class="admin-badge"><i class="fas fa-crown"></i> Admin</span>
            </div>
            <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </header>

        <!-- Stats -->
        <section class="stats-grid">
            <div class="stat-card">
                <div class="number" id="totalPatients">0</div>
                <div class="label">Total Patients</div>
            </div>
            <div class="stat-card">
                <div class="number" id="totalReports">0</div>
                <div class="label">Total Reports</div>
            </div>
            <div class="stat-card">
                <div class="number" id="pendingReports">0</div>
                <div class="label">Pending Reports</div>
            </div>
            <div class="stat-card">
                <div class="number" id="totalAppointments">0</div>
                <div class="label">Appointments</div>
            </div>
        </section>

        <!-- Tabs -->
        <div class="admin-tabs">
            <button class="admin-tab active" data-tab="patients"><i class="fas fa-users"></i> Patients</button>
            <button class="admin-tab" data-tab="reports"><i class="fas fa-flask"></i> Reports</button>
            <button class="admin-tab" data-tab="appointments"><i class="fas fa-calendar"></i> Appointments</button>
            <button class="admin-tab" data-tab="add-report"><i class="fas fa-plus-circle"></i> Add Report</button>
        </div>

        <!-- Patients Tab -->
        <div class="tab-content active" id="tab-patients">
            <div class="table-container">
                <h3><i class="fas fa-users" style="color:var(--primary-light);margin-right:0.5rem;"></i>All Patients</h3>
                <div id="patientsTable">
                    <div class="empty-state">
                        <i class="fas fa-users"></i>
                        <p>Loading patients...</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Reports Tab -->
        <div class="tab-content" id="tab-reports">
            <div class="table-container">
                <h3><i class="fas fa-flask" style="color:var(--primary-light);margin-right:0.5rem;"></i>All Reports</h3>
                <div id="reportsTable">
                    <div class="empty-state">
                        <i class="fas fa-flask"></i>
                        <p>Loading reports...</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Appointments Tab -->
        <div class="tab-content" id="tab-appointments">
            <div class="table-container">
                <h3><i class="fas fa-calendar" style="color:var(--primary-light);margin-right:0.5rem;"></i>All Appointments</h3>
                <div id="appointmentsTable">
                    <div class="empty-state">
                        <i class="fas fa-calendar"></i>
                        <p>Loading appointments...</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Add Report Tab -->
        <div class="tab-content" id="tab-add-report">
            <div class="table-container">
                <h3><i class="fas fa-plus-circle" style="color:var(--primary-light);margin-right:0.5rem;"></i>Add New Report</h3>
                <div class="form-banner" id="reportFormBanner"></div>
                <form id="addReportForm">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Patient Email *</label>
                            <input type="email" id="reportPatientEmail" placeholder="patient@example.com" required>
                        </div>
                        <div class="form-group">
                            <label>Test Name *</label>
                            <input type="text" id="reportTestName" placeholder="e.g., Complete Blood Count" required>
                        </div>
                        <div class="form-group">
                            <label>Status *</label>
                            <select id="reportStatus" required>
                                <option value="pending">Pending</option>
                                <option value="processing">Processing</option>
                                <option value="ready">Ready</option>
                                <option value="completed">Completed</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Report Date</label>
                            <input type="date" id="reportDate">
                        </div>
                        <div class="form-group" style="grid-column:1/-1;">
                            <label>Report File URL (Optional)</label>
                            <input type="url" id="reportFileUrl" placeholder="https://example.com/report.pdf">
                        </div>
                        <div class="form-group" style="grid-column:1/-1;">
                            <label>Notes (Optional)</label>
                            <textarea id="reportNotes" placeholder="Additional notes about the report..."></textarea>
                        </div>
                    </div>
                    <button type="submit" class="btn-submit-form"><i class="fas fa-save"></i> Add Report</button>
                </form>
            </div>
        </div>

        <!-- Footer -->
        <footer style="text-align:center;padding:2rem 0 0.5rem;color:var(--text-muted);font-size:0.8rem;border-top:1px solid var(--border-glass);margin-top:2rem;">
            &copy; <span id="footerYear"></span> The Medicare Laboratory &amp; Diagnostic Center. Admin Panel
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
    <script>
        // =============================================
        // SUPABASE INITIALIZATION
        // =============================================

        // 🔑 APNI KEYS YAHAN DAALO
        const SUPABASE_URL = 'https://YOUR_PROJECT_ID.supabase.co';
        const SUPABASE_ANON_KEY = 'YOUR_ANON_KEY';

        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // =============================================
        // CHECK ADMIN ACCESS
        // =============================================

        async function checkAdmin() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                window.location.href = 'index.html';
                return null;
            }

            // Check if user is admin (you can add an admin flag in users table)
            // For now, allow access (you should add proper admin check)
            return session;
        }

        // =============================================
        // TAB SWITCHING
        // =============================================

        document.querySelectorAll('.admin-tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');

                const tabName = this.dataset.tab;
                document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
                document.getElementById(`tab-${tabName}`).classList.add('active');

                // Load data based on tab
                if (tabName === 'patients') loadPatients();
                else if (tabName === 'reports') loadReports();
                else if (tabName === 'appointments') loadAppointments();
            });
        });

        // =============================================
        // LOAD PATIENTS
        // =============================================

        async function loadPatients() {
            const container = document.getElementById('patientsTable');

            try {
                const { data, error } = await supabase
                    .from('patients')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                if (data && data.length > 0) {
                    container.innerHTML = `
                            <table>
                                <thead>
                                    <tr>
                                        <th>Name</th>
                                        <th>Father's Name</th>
                                        <th>Email</th>
                                        <th>Cell</th>
                                        <th>Created</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${data.map(p => `
                                        <tr>
                                            <td><strong>${p.full_name}</strong></td>
                                            <td>${p.father_name}</td>
                                            <td>${p.email}</td>
                                            <td>${p.cell_number}</td>
                                            <td>${new Date(p.created_at).toLocaleDateString()}</td>
                                            <td>
                                                <button class="btn-action view" onclick="viewPatient('${p.id}')">View</button>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        `;

                    document.getElementById('totalPatients').textContent = data.length;
                } else {
                    container.innerHTML = `
                            <div class="empty-state">
                                <i class="fas fa-users"></i>
                                <p>No patients registered yet</p>
                            </div>
                        `;
                }
            } catch (err) {
                container.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-exclamation-circle"></i>
                            <p>Error loading patients: ${err.message}</p>
                        </div>
                    `;
            }
        }

        // =============================================
        // LOAD REPORTS
        // =============================================

        async function loadReports() {
            const container = document.getElementById('reportsTable');

            try {
                const { data, error } = await supabase
                    .from('test_reports')
                    .select('*, patients(full_name, email)')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                if (data && data.length > 0) {
                    container.innerHTML = `
                            <table>
                                <thead>
                                    <tr>
                                        <th>Patient</th>
                                        <th>Test Name</th>
                                        <th>Status</th>
                                        <th>Date</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${data.map(r => `
                                        <tr>
                                            <td><strong>${r.patients?.full_name || 'Unknown'}</strong><br><small style="color:var(--text-muted);">${r.patients?.email || ''}</small></td>
                                            <td>${r.test_name}</td>
                                            <td><span class="status-badge ${r.status === 'ready' || r.status === 'completed' ? 'active' : r.status === 'processing' ? 'pending' : 'pending'}">${r.status || 'pending'}</span></td>
                                            <td>${new Date(r.report_date || r.created_at).toLocaleDateString()}</td>
                                            <td>
                                                <button class="btn-action edit" onclick="editReport('${r.id}')">Edit</button>
                                                <button class="btn-action delete" onclick="deleteReport('${r.id}')">Delete</button>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        `;

                    const total = data.length;
                    const pending = data.filter(r => r.status === 'pending' || r.status === 'processing').length;
                    document.getElementById('totalReports').textContent = total;
                    document.getElementById('pendingReports').textContent = pending;
                } else {
                    container.innerHTML = `
                            <div class="empty-state">
                                <i class="fas fa-flask"></i>
                                <p>No reports available</p>
                            </div>
                        `;
                }
            } catch (err) {
                container.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-exclamation-circle"></i>
                            <p>Error loading reports: ${err.message}</p>
                        </div>
                    `;
            }
        }

        // =============================================
        // LOAD APPOINTMENTS
        // =============================================

        async function loadAppointments() {
            const container = document.getElementById('appointmentsTable');

            try {
                const { data, error } = await supabase
                    .from('appointments')
                    .select('*, patients(full_name, email)')
                    .order('appointment_date', { ascending: true });

                if (error) throw error;

                if (data && data.length > 0) {
                    container.innerHTML = `
                            <table>
                                <thead>
                                    <tr>
                                        <th>Patient</th>
                                        <th>Doctor</th>
                                        <th>Date</th>
                                        <th>Status</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${data.map(a => `
                                        <tr>
                                            <td><strong>${a.patients?.full_name || 'Unknown'}</strong><br><small style="color:var(--text-muted);">${a.patients?.email || ''}</small></td>
                                            <td>${a.doctor_name}</td>
                                            <td>${new Date(a.appointment_date).toLocaleDateString()}</td>
                                            <td><span class="status-badge ${a.status === 'completed' ? 'active' : a.status === 'cancelled' ? 'inactive' : 'pending'}">${a.status || 'scheduled'}</span></td>
                                            <td>
                                                <button class="btn-action edit" onclick="editAppointment('${a.id}')">Edit</button>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        `;

                    document.getElementById('totalAppointments').textContent = data.length;
                } else {
                    container.innerHTML = `
                            <div class="empty-state">
                                <i class="fas fa-calendar"></i>
                                <p>No appointments scheduled</p>
                            </div>
                        `;
                }
            } catch (err) {
                container.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-exclamation-circle"></i>
                            <p>Error loading appointments: ${err.message}</p>
                        </div>
                    `;
            }
        }

        // =============================================
        // ADD REPORT
        // =============================================

        document.getElementById('addReportForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const banner = document.getElementById('reportFormBanner');
            banner.className = 'form-banner';

            const patientEmail = document.getElementById('reportPatientEmail').value.trim();
            const testName = document.getElementById('reportTestName').value.trim();
            const status = document.getElementById('reportStatus').value;
            const reportDate = document.getElementById('reportDate').value;
            const fileUrl = document.getElementById('reportFileUrl').value.trim();
            const notes = document.getElementById('reportNotes').value.trim();

            // Validate
            if (!patientEmail || !testName) {
                banner.className = 'form-banner show error';
                banner.innerHTML = '<i class="fas fa-circle-exclamation"></i><span>Please fill in all required fields</span>';
                return;
            }

            const btn = this.querySelector('.btn-submit-form');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Adding...';

            try {
                // Find patient by email
                const { data: patient, error: patientError } = await supabase
                    .from('patients')
                    .select('id')
                    .eq('email', patientEmail)
                    .single();

                if (patientError || !patient) {
                    banner.className = 'form-banner show error';
                    banner.innerHTML = '<i class="fas fa-circle-exclamation"></i><span>Patient not found with this email</span>';
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-save"></i> Add Report';
                    return;
                }

                // Add report
                const { data, error } = await supabase
                    .from('test_reports')
                    .insert([{
                        patient_id: patient.id,
                        test_name: testName,
                        status: status,
                        report_date: reportDate || new Date().toISOString(),
                        report_file_url: fileUrl || null,
                        notes: notes || null
                    }]);

                if (error) throw error;

                banner.className = 'form-banner show success';
                banner.innerHTML = '<i class="fas fa-circle-check"></i><span>✅ Report added successfully!</span>';

                // Reset form
                this.reset();
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-save"></i> Add Report';

                // Reload reports
                setTimeout(() => loadReports(), 1000);

            } catch (err) {
                banner.className = 'form-banner show error';
                banner.innerHTML = `<i class="fas fa-circle-exclamation"></i><span>Error: ${err.message}</span>`;
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-save"></i> Add Report';
            }
        });

        // =============================================
        // UTILITY FUNCTIONS
        // =============================================

        async function viewPatient(id) {
            alert(`Viewing patient ${id} - Feature coming soon!`);
        }

        async function editReport(id) {
            alert(`Editing report ${id} - Feature coming soon!`);
        }

        async function deleteReport(id) {
            if (confirm('Are you sure you want to delete this report?')) {
                try {
                    const { error } = await supabase
                        .from('test_reports')
                        .delete()
                        .eq('id', id);

                    if (error) throw error;
                    alert('✅ Report deleted successfully!');
                    loadReports();
                } catch (err) {
                    alert('Error: ' + err.message);
                }
            }
        }

        async function editAppointment(id) {
            alert(`Editing appointment ${id} - Feature coming soon!`);
        }

        // =============================================
        // LOGOUT
        // =============================================

        async function logout() {
            try {
                const { error } = await supabase.auth.signOut();
                if (error) throw error;
                window.location.href = 'index.html?logout=success';
            } catch (err) {
                alert('Error logging out: ' + err.message);
            }
        }

        // =============================================
        // ON PAGE LOAD
        // =============================================

        window.addEventListener('load', async function() {
            const session = await checkAdmin();
            if (!session) return;

            document.getElementById('footerYear').textContent = new Date().getFullYear();

            // Load initial data
            loadPatients();
            loadReports();
            loadAppointments();
        });
    </script>
</body>
</html>

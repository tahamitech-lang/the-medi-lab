<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - The Medicare Laboratory</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2d970d;
            --primary-dark: #1f6e09;
            --primary-light: #4ff054;
            --bg-dark: #080f07;
            --bg-card: rgba(255, 255, 255, 0.04);
            --text-white: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.6);
            --border-glass: rgba(255, 255, 255, 0.06);
            --shadow-glow: 0 30px 80px rgba(0, 0, 0, 0.6);
            --radius: 24px;
            --transition: 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: var(--text-white);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(45, 151, 13, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(79, 240, 84, 0.06) 0%, transparent 60%);
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(79, 240, 84, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(79, 240, 84, 0.02) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% {
                transform: translate(0, 0);
            }
            100% {
                transform: translate(50px, 50px);
            }
        }

        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            pointer-events: none;
            z-index: 0;
            animation: orbFloat 12s ease-in-out infinite alternate;
        }
        .orb-1 {
            width: 400px;
            height: 400px;
            background: rgba(45, 151, 13, 0.1);
            top: -100px;
            right: -100px;
        }
        .orb-2 {
            width: 300px;
            height: 300px;
            background: rgba(79, 240, 84, 0.06);
            bottom: -50px;
            left: -50px;
            animation-delay: 4s;
        }

        @keyframes orbFloat {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(40px, -40px) scale(1.2);
            }
        }

        .reset-container {
            position: relative;
            z-index: 1;
            max-width: 440px;
            width: 100%;
            background: var(--bg-card);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius);
            padding: 2.5rem 2rem;
            box-shadow: var(--shadow-glow);
            animation: cardIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }

        .reset-container::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: var(--radius);
            padding: 1px;
            background: linear-gradient(135deg, rgba(79, 240, 84, 0.12), transparent 50%, rgba(79, 240, 84, 0.04));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .reset-logo {
            text-align: center;
            margin-bottom: 1.8rem;
        }

        .reset-logo img {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: 2px solid rgba(79, 240, 84, 0.3);
            margin-bottom: 0.5rem;
        }

        .reset-logo h1 {
            font-size: 1.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff, rgba(255, 255, 255, 0.7));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .reset-title {
            font-size: 1.6rem;
            font-weight: 900;
            letter-spacing: -0.03em;
            margin-bottom: 0.3rem;
        }

        .reset-title .highlight {
            background: linear-gradient(135deg, var(--primary-light), var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .reset-sub {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 1.8rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--text-light);
            margin-bottom: 0.35rem;
            letter-spacing: 0.02em;
        }

        .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrap .icon {
            position: absolute;
            left: 14px;
            color: var(--text-muted);
            font-size: 0.9rem;
            pointer-events: none;
            transition: color 0.3s;
        }

        .input-wrap input {
            width: 100%;
            padding: 0.85rem 0.9rem 0.85rem 2.6rem;
            background: rgba(255, 255, 255, 0.04);
            border: 1.5px solid var(--border-glass);
            border-radius: 12px;
            font-size: 0.92rem;
            color: #fff;
            font-family: inherit;
            transition: border-color 0.3s, box-shadow 0.3s, background 0.3s;
        }

        .input-wrap input:focus {
            outline: none;
            border-color: var(--primary-light);
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 0 4px rgba(79, 240, 84, 0.06);
        }

        .input-wrap input::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }

        .input-wrap input:focus+.icon {
            color: var(--primary-light);
        }

        .btn-submit {
            width: 100%;
            padding: 0.95rem;
            border: none;
            border-radius: 60px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            font-weight: 800;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all var(--transition);
            box-shadow: 0 4px 24px rgba(45, 151, 13, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            margin-top: 0.2rem;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 40px rgba(45, 151, 13, 0.45);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .form-banner {
            display: none;
            align-items: flex-start;
            gap: 0.6rem;
            padding: 0.85rem 1rem;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 1rem;
            animation: bannerIn 0.4s ease;
        }

        .form-banner.show {
            display: flex;
        }

        .form-banner.success {
            background: rgba(79, 240, 84, 0.08);
            border: 1px solid rgba(79, 240, 84, 0.15);
            color: var(--primary-light);
        }

        .form-banner.error {
            background: rgba(255, 107, 107, 0.08);
            border: 1px solid rgba(255, 107, 107, 0.15);
            color: #ff6b6b;
        }

        @keyframes bannerIn {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: color 0.3s;
            background: none;
            border: none;
            margin-top: 1rem;
        }

        .back-link:hover {
            color: var(--primary-light);
        }

        .password-hint {
            font-size: 0.72rem;
            color: var(--text-muted);
            margin-top: 0.3rem;
        }

        @media (max-width: 480px) {
            .reset-container {
                padding: 1.8rem 1.2rem;
            }
            .reset-title {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="reset-container">
        <div class="reset-logo">
            <img src="images/Lab Logo.png" alt="The Medicare Laboratory">
            <h1>The Medicare Laboratory</h1>
        </div>

        <h2 class="reset-title">🔑 Reset <span class="highlight">Password</span></h2>
        <p class="reset-sub">Create a new secure password for your account</p>

        <div class="form-banner" id="resetBanner"></div>

        <form id="resetForm" novalidate>
            <div class="form-group">
                <label for="newPassword"><i class="fas fa-lock" style="margin-right:0.4rem;color:var(--primary-light);"></i>New Password</label>
                <div class="input-wrap">
                    <i class="fas fa-lock icon"></i>
                    <input type="password" id="newPassword" placeholder="Enter new password" required minlength="8">
                </div>
                <div class="password-hint">Use 8+ characters with letters, numbers &amp; symbols</div>
            </div>

            <div class="form-group">
                <label for="confirmPassword"><i class="fas fa-check-circle" style="margin-right:0.4rem;color:var(--primary-light);"></i>Confirm Password</label>
                <div class="input-wrap">
                    <i class="fas fa-check-circle icon"></i>
                    <input type="password" id="confirmPassword" placeholder="Re-enter new password" required>
                </div>
            </div>

            <button type="submit" class="btn-submit" id="resetBtn">
                <span class="btn-text"><i class="fas fa-save"></i> Update Password</span>
                <span class="spinner" style="display:none;width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(255,255,255,0.2);border-top-color:#fff;animation:spin 0.7s linear infinite;"></span>
            </button>
        </form>

        <button type="button" class="back-link" onclick="window.location.href='index.html'">
            <i class="fas fa-arrow-left"></i> Back to Log In
        </button>
    </div>

    <style>
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
    <script>
        // =============================================
        // SUPABASE INITIALIZATION
        // =============================================

        // 🔑 APNI KEYS YAHAN DAALO
        const SUPABASE_URL = 'https://YOUR_PROJECT_ID.supabase.co';
        const SUPABASE_ANON_KEY = 'YOUR_ANON_KEY';

        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // =============================================
        // RESET PASSWORD
        // =============================================

        document.getElementById('resetForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const newPass = document.getElementById('newPassword');
            const confirmPass = document.getElementById('confirmPassword');
            const banner = document.getElementById('resetBanner');
            const btn = document.getElementById('resetBtn');
            const spinner = btn.querySelector('.spinner');
            const btnText = btn.querySelector('.btn-text');

            // Hide previous banner
            banner.className = 'form-banner';

            // Validate
            if (newPass.value.length < 8) {
                banner.className = 'form-banner show error';
                banner.innerHTML = '<i class="fas fa-circle-exclamation"></i><span>Password must be at least 8 characters</span>';
                newPass.focus();
                return;
            }

            if (newPass.value !== confirmPass.value) {
                banner.className = 'form-banner show error';
                banner.innerHTML = '<i class="fas fa-circle-exclamation"></i><span>Passwords do not match</span>';
                confirmPass.focus();
                return;
            }

            // Loading state
            btn.disabled = true;
            spinner.style.display = 'block';
            btnText.innerHTML = 'Updating...';

            try {
                const { data, error } = await supabase.auth.updateUser({
                    password: newPass.value
                });

                if (error) throw error;

                banner.className = 'form-banner show success';
                banner.innerHTML = '<i class="fas fa-circle-check"></i><span>✅ Password updated successfully!</span>';

                btnText.innerHTML = '✅ Done!';
                spinner.style.display = 'none';

                // Redirect after 2 seconds
                setTimeout(() => {
                    window.location.href = 'index.html?reset=success';
                }, 2000);

            } catch (err) {
                banner.className = 'form-banner show error';
                banner.innerHTML = `<i class="fas fa-circle-exclamation"></i><span>${err.message || 'Something went wrong. Please try again.'}</span>`;
                btn.disabled = false;
                spinner.style.display = 'none';
                btnText.innerHTML = '<i class="fas fa-save"></i> Update Password';
            }
        });

        // =============================================
        // CHECK IF USER IS LOGGED IN (for reset)
        // =============================================

        window.addEventListener('load', async function() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                // If no session, redirect to login (user should come from reset email link)
                console.log('No session found. Make sure you clicked the reset link from email.');
            }
        });
    </script>

</body>
</html>
